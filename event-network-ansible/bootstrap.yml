---
- name: Bootstrap Python on SSH-accessible Debian 13 hosts
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Install minimum Ansible prerequisites if absent
      ansible.builtin.raw: |
        set -eu
        . /etc/os-release
        test "$ID" = debian && test "$VERSION_ID" = 13
        if ! command -v python3 >/dev/null || ! dpkg-query -W python3-apt >/dev/null 2>&1; then
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y python3 python3-apt
          echo EVENT_BOOTSTRAPPED
        fi
      register: event_bootstrap
      changed_when: "'EVENT_BOOTSTRAPPED' in event_bootstrap.stdout"
