---
- name: Verify event and normal network modes
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    event_sshd_port: 22
    event_normal_ssh_port: 22
    event_normal_if: djlan
    event_dj_if: djlan
    event_guest_if: guestlan
    event_tun: mqvpn0
    event_gateway_admin_cidrs: [192.168.50.10/32]
    event_mgmt_ifs: [djlan]
    event_unrestricted_ssh_ifs: [djlan]
    event_blocked_v4: []
    event_extra_blocked_v4: []
    event_performer_net: 192.168.50.0/24
    event_guest_net: 192.168.60.0/24
    event_guest_router_lan: 192.168.70.0/24
    event_vpn_subnet: 10.77.0.0/24
  tasks:
    - name: Render event firewall
      ansible.builtin.set_fact:
        event_firewall: "{{ lookup('template', '../roles/event/templates/gateway-firewall.nft.j2') }}"

    - name: Require unrestricted management SSH and restricted guest SSH
      ansible.builtin.assert:
        that:
          - event_firewall.find('iifname { "djlan" } tcp dport 22 accept') >= 0
          - event_firewall.find('iifname @lans tcp dport 22 ip saddr != { 192.168.50.10/32 } drop') >= 0

    - name: Render event firewall without source CIDRs
      ansible.builtin.set_fact:
        unrestricted_event_firewall: >-
          {{ lookup('template', '../roles/event/templates/gateway-firewall.nft.j2') }}
      vars:
        event_gateway_admin_cidrs: []

    - name: Require unrestricted-only event firewall to remain valid
      ansible.builtin.assert:
        that:
          - unrestricted_event_firewall.find('iifname { "djlan" } tcp dport 22 accept') >= 0
          - unrestricted_event_firewall.find('ip saddr != {') == -1

    - name: Render normal network and firewall
      ansible.builtin.set_fact:
        normal_network: "{{ lookup('template', '../roles/event/templates/normal-network.j2') }}"
        normal_firewall: "{{ lookup('template', '../roles/event/templates/normal-firewall.nft.j2') }}"

    - name: Require DHCP default route and unrestricted normal SSH
      ansible.builtin.assert:
        that:
          - "'Name=djlan' in normal_network"
          - "'DHCP=ipv4' in normal_network"
          - normal_firewall.find('iifname "djlan" tcp dport 22 accept') >= 0
          - normal_firewall.find('type filter hook forward priority 10; policy drop;') >= 0
