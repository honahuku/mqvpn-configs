name: Terraform server validation

'on':
  pull_request:
    paths:
      - terraform/server/**
      - .github/workflows/terraform-server.yml
  push:
    paths:
      - terraform/server/**
      - .github/workflows/terraform-server.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: terraform/server
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.17.0
          terraform_wrapper: false

      - name: Set up TFLint
        uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: v0.64.0

      - name: Check formatting
        run: terraform fmt -check -diff -recursive .

      - name: Initialize providers without the remote backend
        run: terraform init -backend=false -input=false -lockfile=readonly

      - name: Validate
        run: terraform validate -no-color

      - name: Test without GCP credentials or resource creation
        run: terraform test -no-color

      - name: Lint
        run: tflint --config=.tflint.hcl

      - name: Save generated provider lock
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: provider-lock-server
          path: terraform/server/.terraform.lock.hcl
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
