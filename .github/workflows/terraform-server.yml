name: Terraform server validation

'on':
  pull_request:
    paths:
      - terraform/server/**
      - .github/workflows/terraform-server.yml
  push:
    paths:
      - terraform/server/**
      - .github/workflows/terraform-server.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: terraform/server
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.17.0
          terraform_wrapper: false

      - name: Set up TFLint
        uses: terraform-linters/setup-tflint@6e87008f9dd1fe3e34e66aca6c97b4a69f72a7f4 # v4
        with:
          tflint_version: v0.64.0

      - name: Check formatting
        run: terraform fmt -check -diff -recursive .

      - name: Initialize providers without the remote backend
        run: terraform init -backend=false -input=false

      - name: Validate
        run: terraform validate -no-color

      - name: Test without GCP credentials or resource creation
        run: terraform test -no-color

      - name: Lint
        run: tflint --config=.tflint.hcl

      - name: Save generated provider lock
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: provider-lock-server
          path: terraform/server/.terraform.lock.hcl
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
